name: ECM build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test library, bindings, and route lab
        run: |
          python -m pip install 'pybind11==3.0.1'
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            "-DPython3_EXECUTABLE=$(command -v python)" \
            "-Dpybind11_DIR=$(python -m pybind11 --cmakedir)"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          python apps/route-lab/tests/smoke_browser.py build/bin/solar-race
      - name: Test the installed C++ package and CLI
        run: |
          prefix="$PWD/build/install"
          cmake --install build --prefix "$prefix"
          cmake -S tests/consumer -B build/consumer "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build build/consumer --parallel
          ctest --test-dir build/consumer --output-on-failure
          cd "$RUNNER_TEMP"
          "$prefix/bin/solar-race" --trials 2 --seed 42 > trial-results.csv
      - name: Test installation from the source distribution
        run: |
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          python tests/python/test_ecm.py
          python tests/python/test_cont.py
          python tests/python/test_drive_cycle.py
